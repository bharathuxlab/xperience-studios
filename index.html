<title>Xperience Studios</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --void:#000000;
  --surface:#0a0a0c;
  --surface-2:#111114;
  --border:rgba(255,255,255,0.09);
  --border-strong:rgba(255,255,255,0.18);
  --text:#f5f5f7;
  --text-dim:#8a8a92;
  --amber:#f5b841;
  --slate:#9aa4b2;
  --bg:var(--void);
  --accent:var(--amber);
  --accent-2:var(--slate);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:var(--void)}
h1,h2,h3,.disp{
  font-family:'Sora',system-ui,sans-serif;
  text-wrap:balance;
  letter-spacing:-0.02em;
  font-weight:800;
}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
@media(max-width:720px){.wrap{padding:0 20px}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}
}

main{position:relative}
section{padding:130px 0;scroll-margin-top:90px}
@media(max-width:720px){section{padding:80px 0}}

/* ---------- NAV ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 32px;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
@media(max-width:720px){.nav{padding:16px 20px}}
.logo{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:800;font-family:'Sora',sans-serif;letter-spacing:-0.01em}
.logo .mark{width:26px;height:26px;flex:none;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.logo .mark svg{width:100%;height:100%;display:block}
.logo:hover .mark{transform:rotate(-8deg) scale(1.06)}
.navlinks{display:flex;gap:6px;align-items:center}
.navlinks a{font-size:14px;color:var(--text-dim);transition:all .2s ease;padding:9px 14px;border-radius:0}
.navlinks a:hover{color:var(--text);background:rgba(255,255,255,0.06)}
.pill{
  display:inline-flex;align-items:center;gap:8px;background:var(--text);color:var(--void);font-weight:700;
  padding:10px 20px;border-radius:0;border:none;cursor:pointer;font-size:14px;transition:all .25s cubic-bezier(.16,1,.3,1);
}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 26px -8px rgba(255,255,255,0.35)}
.pill-outline{
  display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--text);font-weight:700;
  padding:10px 20px;border-radius:0;border:1px solid var(--border-strong);cursor:pointer;font-size:14px;transition:all .25s ease;
}
.pill-outline:hover{border-color:var(--text);background:rgba(255,255,255,0.05)}
.navlinks .pill{margin-left:6px;padding:9px 18px;font-size:13.5px}
@media(max-width:820px){.navlinks a:not(.pill){display:none}}

/* ---------- HERO ---------- */
.hero{
  position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;
  padding:150px 28px 40px;overflow:hidden;isolation:isolate;background:#050506;
}
.hero-vignette{
  position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.15) 65%, rgba(0,0,0,0.85) 100%),
    radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
}
.hero-plus{position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero-plus span{
  position:absolute;color:rgba(245,245,247,0.28);font-size:18px;line-height:1;font-family:'IBM Plex Mono',monospace;
}
.hero-mark{position:relative;z-index:1}
.hero-mark .word{
  display:flex;align-items:flex-end;flex-wrap:wrap;gap:0 22px;
  font-family:'Sora',sans-serif;font-weight:800;letter-spacing:-0.045em;
  font-size:clamp(58px,13vw,190px);line-height:0.82;color:var(--text);
  opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) .15s forwards;
}
.hero-mark .word sup{font-size:0.32em;font-weight:600;letter-spacing:0;margin-left:2px;top:-0.5em}
.hero-mark .word2{
  font-family:'Sora',sans-serif;font-weight:700;letter-spacing:-0.02em;
  font-size:clamp(26px,4vw,54px);color:var(--text-dim);margin-top:4px;
  opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) .3s forwards;
}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.hero-tags{
  position:absolute;top:150px;right:28px;z-index:1;text-align:right;
  display:flex;flex-direction:column;gap:9px;
  opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) .45s forwards;
}
.hero-tags span{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;color:var(--text)}
@media(max-width:720px){.hero-tags{display:none}}

.hero-foot{
  position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:30px;
  margin-top:60px;flex-wrap:wrap;
  opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) .6s forwards;
}
.hero-stmt{max-width:38ch}
.hero-stmt p{font-size:15.5px;color:var(--text-dim);line-height:1.6}
.hero-stmt .cr{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(245,245,247,0.4)}

.hero-cta-row{position:relative;z-index:1;display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;
  opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) .5s forwards;
}

/* ---------- DEMO CARD ---------- */
.demo-wrap{margin-top:70px}
.demo-card{
  position:relative;border-radius:0;border:1px solid var(--border-strong);
  background:var(--surface);overflow:hidden;padding:1px;
}
.demo-glow{
  position:absolute;inset:-1px;border-radius:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%), rgba(245,184,65,0.35), transparent 60%);
}
.demo-card:hover .demo-glow{opacity:1}
.demo-inner{position:relative;background:var(--surface);border-radius:0;padding:0}
.demo-chrome{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--border)}
.demo-chrome .dotc{width:10px;height:10px;border-radius:50%;background:var(--border-strong)}
.demo-chrome .label{margin-left:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim)}
.demo-body{padding:36px 32px 32px}
@media(max-width:600px){.demo-body{padding:24px 18px}}
.demo-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.demo-chip{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:9px 16px;border-radius:0;
  border:1px solid var(--border-strong);color:var(--text-dim);cursor:pointer;transition:all .25s ease;background:transparent;
}
.demo-chip.active{background:var(--accent);color:var(--void);border-color:var(--accent)}
.demo-chip:not(.active):hover{border-color:var(--text-dim);color:var(--text)}
.demo-thread{min-height:150px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end}
.bubble{max-width:78%;padding:14px 18px;border-radius:0;font-size:14.5px;line-height:1.55;
  opacity:0;transform:translateY(10px);transition:all .45s cubic-bezier(.16,1,.3,1);
}
.bubble.in{opacity:1;transform:translateY(0)}
.bubble.you{align-self:flex-end;background:var(--surface-2);border:1px solid var(--border-strong)}
.bubble.us{align-self:flex-start;background:rgba(245,184,65,0.10);border:1px solid rgba(245,184,65,0.3)}
.bubble.us b{color:var(--accent)}

.demo-case{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:18px;
  border-bottom:1px solid var(--border);
  opacity:0;transform:translateY(-6px);transition:all .5s cubic-bezier(.16,1,.3,1);
}
.demo-case.in{opacity:1;transform:translateY(0)}
.demo-case .dc-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
.demo-case .dc-name{font-weight:700;font-size:14px}
.demo-case .dc-sep{color:var(--text-dim)}
.demo-case .dc-project{font-size:13.5px;color:var(--text-dim)}

.typing-dots{display:inline-flex;gap:4px;align-items:center;height:14px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;animation:typingBounce 1.1s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.demo-continue{
  margin-top:22px;background:var(--accent);color:var(--void);border:none;font-weight:700;font-size:14px;
  padding:12px 22px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .25s ease;
}
.demo-continue:hover{transform:translateY(-2px)}

.demo-services{margin-top:24px;padding-top:22px;border-top:1px solid var(--border);opacity:0;transition:opacity .5s ease}
.demo-services.in{opacity:1}
.ds-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
.ds-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ds-chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 14px;border:1px solid var(--border-strong);color:var(--text)}
.demo-endrow{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
.demo-replay{background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;transition:color .2s ease}
.demo-replay:hover{color:var(--text)}

/* ---------- REVEAL (scroll-scrubbed via GSAP, see useReveal) ---------- */
.reveal{opacity:0;will-change:transform,opacity}
.reveal.in{opacity:1}

/* ---------- SECTION HEAD ---------- */
.section-head{margin-bottom:52px;max-width:640px}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);display:block;margin-bottom:16px}
.section-head h2{font-size:clamp(28px,3.6vw,44px);line-height:1.1}
.section-head p{color:var(--text-dim);font-size:16px;line-height:1.6;margin-top:16px;max-width:52ch}

/* ---------- BENTO ---------- */
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.bento{grid-template-columns:1fr}}
.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:0;padding:30px;
  transition:border-color .3s ease, transform .1s ease;transform-style:preserve-3d;perspective:800px;
  display:flex;flex-direction:column;min-height:340px;
}
.tile:hover{border-color:var(--border-strong)}
.tile .tile-vis{flex:1;border-radius:0;background:var(--surface-2);border:1px solid var(--border);margin-bottom:22px;position:relative;overflow:hidden;min-height:150px}
.tile h3{font-size:19px;margin-bottom:8px}
.tile p{color:var(--text-dim);font-size:14px;line-height:1.6}

/* tile 1: collab cursor */
.vis-cursor{position:absolute;inset:14px}
.vis-cursor .row{height:8px;border-radius:0;background:var(--border-strong);margin-bottom:10px}
.vis-cursor .row:nth-child(2){width:70%}
.vis-cursor .row:nth-child(3){width:85%}
.vis-cursor .row:nth-child(4){width:55%}
.vis-cursor .cur{
  position:absolute;display:flex;align-items:center;gap:6px;transition:all 2.6s cubic-bezier(.4,0,.2,1);
}
.vis-cursor .cur .arrow{width:0;height:0;border-style:solid;border-width:0 5px 8px 0;border-color:transparent var(--accent) transparent transparent;transform:rotate(200deg)}
.vis-cursor .cur .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--accent);color:var(--void);padding:2px 8px;border-radius:0;white-space:nowrap}

/* tile 2: research chips */
.vis-research{position:absolute;inset:14px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.vis-research .r{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);padding:10px 12px;
  border:1px solid var(--border);border-radius:0;opacity:0;transform:translateX(-8px);
  transition:all .6s cubic-bezier(.16,1,.3,1);
}
.vis-research .r.show{opacity:1;transform:translateX(0)}
.vis-research .r b{color:var(--accent-2);font-weight:500}

/* tile 3: tokens */
.vis-tokens{position:absolute;inset:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:center}
.vis-tokens .sw{aspect-ratio:1;border-radius:0;border:1px solid var(--border-strong)}

/* ---------- TABS ---------- */
.tabs-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.tab-btn{
  font-size:14px;font-weight:600;color:var(--text-dim);background:transparent;border:1px solid var(--border);
  padding:11px 20px;border-radius:0;cursor:pointer;transition:all .25s ease;
}
.tab-btn.active{color:var(--void);background:var(--text);border-color:var(--text)}
.tab-btn:not(.active):hover{border-color:var(--border-strong);color:var(--text)}
.tab-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:0;padding:40px;min-height:260px;
}
@media(max-width:600px){.tab-panel{padding:24px}}
.tab-fade{opacity:0;animation:tabin .5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes tabin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.token-row{display:grid;grid-template-columns:1fr 1fr 2fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.token-row:last-child{border-bottom:none}
.token-row .tn{font-family:'IBM Plex Mono',monospace;color:var(--accent-2)}
.token-row .tv{font-family:'IBM Plex Mono',monospace;color:var(--text-dim)}
.fidelity-row{display:flex;align-items:center;gap:0}
.fid-step{flex:1;text-align:center;position:relative}
.fid-step .dot{width:14px;height:14px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border-strong);margin:0 auto 12px;position:relative;z-index:2}
.fid-step.done .dot{background:var(--accent);border-color:var(--accent)}
.fid-step .lbl{font-size:12.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace}
.fid-step.done .lbl{color:var(--text)}
.fid-line{position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--border-strong);z-index:1}
.fid-step.done .fid-line{background:var(--accent)}
.fid-step:first-child .fid-line{display:none}
.audit-table{width:100%;border-collapse:collapse;font-size:13.5px}
.audit-table th{text-align:left;color:var(--text-dim);font-weight:500;font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding-bottom:14px;border-bottom:1px solid var(--border)}
.audit-table td{padding:14px 0;border-bottom:1px solid var(--border)}
.audit-table tr:last-child td{border-bottom:none}
.audit-table .lift{color:var(--accent);font-weight:600}
.method-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.method-chip{border:1px solid var(--border-strong);border-radius:0;padding:16px 18px;flex:1;min-width:150px}
.method-chip .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent-2);margin-bottom:6px;display:block}
.method-chip .t{font-size:14.5px;font-weight:600}
.tab-note{font-size:13px;color:var(--text-dim);margin-top:20px;font-style:normal}

/* ---------- WORK GRID ---------- */
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:760px){.work-grid{grid-template-columns:1fr}}
.work-card{
  background:var(--surface);border:1px solid var(--border);border-radius:0;padding:30px;
  transition:border-color .3s ease;position:relative;overflow:hidden;
}
.work-card:hover{border-color:var(--border-strong)}
.work-card{cursor:pointer}
.work-card .tt{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.work-card h3{font-size:21px;margin-top:18px;font-weight:700}
.work-card p{color:var(--text-dim);font-size:14px;line-height:1.6;margin-top:12px}
.work-toggle{
  display:flex;align-items:center;gap:8px;margin-top:20px;background:none;border:none;color:var(--accent);
  font-size:13px;font-weight:600;cursor:pointer;padding:0;
}
.work-toggle .chev{display:flex;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.work-card.open .work-toggle .chev{transform:rotate(180deg)}
.work-detail{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.16,1,.3,1)}
.work-detail ul{margin-top:18px;padding-top:18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.work-detail li{list-style:none;font-size:13.5px;color:var(--text-dim);padding-left:20px;position:relative}
.work-detail li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ---------- PROCESS ROW ---------- */
.process-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.process-scroll::-webkit-scrollbar{height:6px}
.process-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:0}
.pcard{
  scroll-snap-align:start;flex:0 0 260px;background:var(--surface);border:1px solid var(--border);
  border-radius:0;padding:26px;text-align:left;cursor:pointer;transition:border-color .25s ease,background .25s ease;
  font:inherit;color:inherit;
}
@media(max-width:520px){.pcard{flex-basis:78vw}}
.pcard:hover{border-color:var(--border-strong)}
.pcard.active{border-color:var(--accent);background:var(--surface-2)}
.pcard .n{font-family:'IBM Plex Mono',monospace;font-size:26px;color:var(--accent);font-weight:600}
.pcard h3{font-size:18px;margin:14px 0 8px}
.pcard p{color:var(--text-dim);font-size:13.5px;line-height:1.6}
.process-out{
  margin-top:20px;padding:24px 28px;border:1px solid var(--border);border-radius:0;background:var(--surface);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.process-out .po-label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent-2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.process-out p{font-size:14.5px;color:var(--text)}

/* ---------- CONTACT ---------- */
.contact-card{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:0;padding:70px 56px;
  text-align:center;position:relative;overflow:hidden;
}
@media(max-width:720px){.contact-card{padding:44px 26px}}
.contact-card h2{font-size:clamp(32px,5.2vw,58px);max-width:16ch;margin:0 auto}
.contact-card .sub{color:var(--text-dim);font-size:16px;margin:20px auto 34px;max-width:44ch}
.contact-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.contact-actions .pill.ready{background:var(--accent);box-shadow:0 10px 30px -8px rgba(245,184,65,0.45)}
.builder{display:flex;flex-direction:column;gap:20px;max-width:560px;margin:0 auto 34px}
.builder-row{display:flex;flex-direction:column;align-items:center;gap:12px}
@media(max-width:600px){.builder-row{align-items:flex-start}}
.builder-label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
.builder-chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
@media(max-width:600px){.builder-chips{justify-content:flex-start}}

/* ---------- PROJECT MODAL ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);
  display:flex;align-items:flex-start;justify-content:center;padding:80px 20px 40px;
  opacity:0;pointer-events:none;transition:opacity .3s ease;overflow-y:auto;
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-panel{
  width:min(640px,100%);background:var(--surface);border:1px solid var(--border-strong);
  padding:44px 40px;position:relative;
  transform:translateY(16px) scale(0.98);transition:transform .35s cubic-bezier(.16,1,.3,1);
}
.modal-overlay.open .modal-panel{transform:translateY(0) scale(1)}
@media(max-width:600px){.modal-panel{padding:30px 22px}}
.modal-x{
  position:absolute;top:20px;right:20px;width:36px;height:36px;background:none;border:1px solid var(--border-strong);
  color:var(--text);cursor:pointer;font-size:14px;transition:all .25s ease;
}

const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function useReveal(){
  useEffect(()=>{
    const els = document.querySelectorAll('.reveal');
    if(prefersReduced){ els.forEach(e=>e.classList.add('in')); return; }
    gsap.registerPlugin(ScrollTrigger);

    els.forEach((el, i)=>{
      el.classList.add('in');
      const fromScale = el.classList.contains('reveal-zoomout') ? 1.12 : 0.9;
      gsap.fromTo(el,
        {opacity:0, scale:fromScale, y:46},
        {
          opacity:1, scale:1, y:0, ease:'none',
          scrollTrigger:{trigger:el, start:'top 92%', end:'top 48%', scrub:0.7}
        }
      );
    });

    document.querySelectorAll('.parallax-slow, .parallax-fast').forEach(el=>{
      const dist = el.classList.contains('parallax-fast') ? 140 : 60;
      gsap.to(el, {
        y: -dist, ease:'none',
        scrollTrigger:{trigger: el.closest('section')||el, start:'top bottom', end:'bottom top', scrub:true}
      });
    });

    document.querySelectorAll('.zoom-shell').forEach(el=>{
      gsap.fromTo(el, {scale:1.14}, {
        scale:1, ease:'none',
        scrollTrigger:{trigger:el, start:'top bottom', end:'top 20%', scrub:0.8}
      });
    });

    return ()=>ScrollTrigger.getAll().forEach(st=>st.kill());
  },[]);
}

function DemoCard(){
  const [active, setActive] = useState(0);
  const [step, setStep] = useState(0);
  const cardRef = useRef(null);
  const timers = useRef([]);
  const started = useRef(false);

  function clearTimers(){ timers.current.forEach(clearTimeout); timers.current = []; }
  function schedule(ms, fn){ timers.current.push(setTimeout(fn, ms)); }

  function playIntro(){
    clearTimers();
    setStep(0);
    if(prefersReduced){ setStep(5); return; }
    schedule(250, ()=>setStep(1));   // client card
    schedule(1100,()=>setStep(2));   // studio typing
    schedule(2300,()=>setStep(3));   // studio welcome shown
    schedule(3100,()=>setStep(4));   // client typing
    schedule(4200,()=>setStep(5));   // client message shown — waits for click
  }

  function continueThread(){
    if(step !== 5) return;
    clearTimers();
    setStep(6); // studio typing
    schedule(900, ()=>setStep(7));  // response shown
    schedule(1650,()=>setStep(8));  // services shown
  }

  useEffect(()=>{
    const el = cardRef.current;
    if(!el) return;
    if(!prefersReduced){
      const setX = gsap.quickSetter(el, '--mx', 'px');
      const setY = gsap.quickSetter(el, '--my', 'px');
      function onMove(e){
        const r = el.getBoundingClientRect();
        setX(e.clientX - r.left);
        setY(e.clientY - r.top);
      }
      el.addEventListener('mousemove', onMove);
      var cleanupMove = ()=>el.removeEventListener('mousemove', onMove);
    }
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting && !started.current){
          started.current = true;
          playIntro();
        }
      });
    },{threshold:0.35});
    io.observe(el);
    return ()=>{ io.disconnect(); if(cleanupMove) cleanupMove(); clearTimers(); };
  },[]);

  function pick(i){
    if(i===active) return;
    setActive(i);
    started.current = true;
    playIntro();
  }

  const d = DEMOS[active];

  return (
    <div className="demo-wrap reveal reveal-zoomout">
      <div className="demo-card" ref={cardRef}>
        <div className="demo-glow"></div>
        <div className="demo-inner">
          <div className="demo-chrome">
            <span className="dotc"></span><span className="dotc"></span><span className="dotc"></span>
            <span className="label">How it starts — a scripted example, not a live chat</span>
          </div>
          <div className="demo-body">
            <div className="demo-chips">
              {DEMOS.map((s,i)=>(
                <button key={s.chip} className={"demo-chip"+(active===i?" active":"")} onClick={()=>pick(i)}>{s.chip}</button>
              ))}
            </div>

            <div className={"demo-case"+(step>=1?" in":"")}>
              <span className="dc-label">Client</span>
              <span className="dc-name">{d.client}</span>
              <span className="dc-sep">·</span>
              <span className="dc-project">{d.project}</span>
            </div>

            <div className="demo-thread">
              <div className={"bubble us"+(step>=3?" in":"")}>
                {step===2 ? <TypingDots/> : d.welcome}
              </div>
              {step>=4 && (
                <div className={"bubble you"+(step>=5?" in":"")}>
                  {step===4 ? <TypingDots/> : d.you}
                </div>
              )}
              {step>=6 && (
                <div className={"bubble us"+(step>=7?" in":"")}>
                  {step===6 ? <TypingDots/> : d.us}
                </div>
              )}
            </div>

            {step===5 && (
              <button className="demo-continue" onClick={continueThread}>
                See our first move {ARROW}
              </button>
            )}

            {step>=8 && (
              <div className="demo-services in">
                <span className="ds-label">Relevant here</span>
                <div className="ds-chips">
                  {d.services.map(s=>(<span key={s} className="ds-chip">{s}</span>))}
                </div>
                <div className="demo-endrow">
                  <StartProjectButton className="pill">Start a project like this {ARROW}</StartProjectButton>
                  <button className="demo-replay" onClick={playIntro}>Replay ↺</button>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function TileCursor(){

function TiltTile({children, title, desc}){
  const ref = useRef(null);
  function onMove(e){
    if(prefersReduced) return;
    const el = ref.current;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width - 0.5;
    const py = (e.clientY - r.top)/r.height - 0.5;
    el.style.transform = `rotateY(${px*6}deg) rotateX(${-py*6}deg)`;
  }
  function onLeave(){ if(ref.current) ref.current.style.transform = 'rotateY(0) rotateX(0)'; }
  return (
    <div className="tile reveal" ref={ref} onMouseMove={onMove} onMouseLeave={onLeave}>
      <div className="tile-vis">{children}</div>
      <h3>{title}</h3>
      <p>{desc}</p>
    </div>
  );
}

        <div className="section-head reveal">
          <span className="kicker">Process</span>
          <h2>Five stages, one thread.</h2>
          <p>Compressed for a sprint, extended for a system build. Click a stage to see what it hands you.</p>
        </div>
        <div className="process-scroll reveal">
          {STAGES.map((s,i)=>(
            <button className={"pcard"+(active===i?" active":"")} key={s.n} onClick={()=>setActive(i)}>
              <div className="n">{s.n}</div>
              <h3>{s.t}</h3>
              <p>{s.d}</p>
            </button>
          ))}
        </div>
        <div className="process-out reveal">
          <span className="po-label">What you get — Stage {STAGES[active].n}</span>
          <p>{STAGES[active].out}</p>
        </div>
      </div>
    </section>
  );
}

const BUDGETS = ["Under $10K","$10K – $25K","$25K – $50K","$50K+"];
const MODAL_TIMELINES = ["ASAP","Next month","This quarter","Just exploring"];

function ProjectModal(){
  const empty = {first:'', last:'', email:'', phone:'', project:'', links:'', budget:null, timeline:null};
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState(empty);
  const [touched, setTouched] = useState(false);
  const [sentState, setSentState] = useState(null); // null | 'sent'
  const firstFieldRef = useRef(null);

  useEffect(()=>{
    function onOpen(){ setOpen(true); setSentState(null); }
    window.addEventListener('xs-open-project', onOpen);
    return ()=>window.removeEventListener('xs-open-project', onOpen);
  },[]);

  useEffect(()=>{
    if(open){
      document.body.style.overflow = 'hidden';
      setTimeout(()=>{ if(firstFieldRef.current) firstFieldRef.current.focus(); }, 60);
    } else {
      document.body.style.overflow = '';
    }
    return ()=>{ document.body.style.overflow = ''; };
  },[open]);

  useEffect(()=>{
    function onKey(e){ if(e.key === 'Escape') close(); }
    if(open) window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[open]);

  function close(){ setOpen(false); }
  function set(k,v){ setForm(f=>({...f, [k]:v})); }
  function clearForm(){ setForm(empty); setTouched(false); }

  const valid = form.first.trim() && form.last.trim() && /\S+@\S+\.\S+/.test(form.email) && form.project.trim() && form.budget;

  function buildBrief(){
    return [
      `New project brief from ${form.first} ${form.last}`,
      ``,
      `Name: ${form.first} ${form.last}`,
      `Email: ${form.email}`,
      form.phone ? `Phone: ${form.phone}` : null,
      `Budget: ${form.budget}`,
      form.timeline ? `Timeline: ${form.timeline}` : null,
      ``,
      `Project:`,
      form.project,
      form.links ? `\nLinks:\n${form.links}` : null,
    ].filter(Boolean).join('\n');
  }

  function submit(e){
    e.preventDefault();
    setTouched(true);
    if(!valid) return;
    const brief = buildBrief();
    const subject = `Project brief — ${form.first} ${form.last}`;
    window.location.href = `mailto:bharath@xperiencestudios.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(brief)}`;
    setSentState('sent');
  }

  function copyBrief(){
    navigator.clipboard && navigator.clipboard.writeText(buildBrief());
  }

  return (
    <div className={"modal-overlay"+(open?" open":"")} onMouseDown={(e)=>{ if(e.target===e.currentTarget) close(); }}>
      <div className="modal-panel" role="dialog" aria-modal="true" aria-label="Start a project">
        <button type="button" className="modal-x" onClick={close} aria-label="Close">✕</button>

        {sentState==='sent' ? (
          <div className="modal-sent">
            <span className="kicker">Brief sent</span>
            <h3>Your email client should be open now.</h3>
            <p>If nothing happened — some browsers block it without a default mail app set — copy the brief below and send it to <b>bharath@xperiencestudios.com</b> directly.</p>
            <div className="modal-sent-actions">
              <button type="button" className="pill" onClick={copyBrief}>Copy brief</button>
              <button type="button" className="pill-outline" onClick={()=>{ clearForm(); setSentState(null); }}>Start another</button>
            </div>
          </div>
        ) : (
          <form onSubmit={submit} noValidate>
            <span className="kicker">Start a project</span>
            <h3>Let's translate the brief into a plan.</h3>
            <p className="modal-sub">Fill this in — we read every one ourselves, no forms team in between.</p>

            <div className="form-section">
              <div className="form-section-head">
                <span>Personal information</span>
                <button type="button" className="form-clear" onClick={clearForm}>Clear</button>
              </div>
              <div className="form-grid">
                <label className="field">
                  <span>First name*</span>
                  <input ref={firstFieldRef} value={form.first} onChange={e=>set('first', e.target.value)} required/>
                </label>
                <label className="field">
                  <span>Last name*</span>
                  <input value={form.last} onChange={e=>set('last', e.target.value)} required/>
                </label>
                <label className="field">
                  <span>Email*</span>
                  <input type="email" value={form.email} onChange={e=>set('email', e.target.value)} required/>
                </label>
                <label className="field">
                  <span>Phone <i>(optional)</i></span>
                  <input type="tel" value={form.phone} onChange={e=>set('phone', e.target.value)}/>
                </label>
              </div>
            </div>

            <div className="form-section">
              <div className="form-section-head"><span>Project details</span></div>
              <label className="field">
                <span>Tell us what's going on*</span>
                <textarea rows="4" value={form.project} onChange={e=>set('project', e.target.value)}
                  placeholder="What you're building, what's broken, or what you're trying to figure out." required/>
              </label>
              <label className="field">
                <span>Links to share <i>(optional)</i></span>
                <input value={form.links} onChange={e=>set('links', e.target.value)} placeholder="Figma, live site, deck…"/>
              </label>

              <div className="field">
                <span>Budget*</span>
                <div className="chip-select">
                  {BUDGETS.map(b=>(
                    <button type="button" key={b} className={"demo-chip"+(form.budget===b?" active":"")} onClick={()=>set('budget', b)}>{b}</button>
                  ))}
                </div>
              </div>
              <div className="field">
                <span>Timeline <i>(optional)</i></span>
                <div className="chip-select">
                  {MODAL_TIMELINES.map(t=>(
                    <button type="button" key={t} className={"demo-chip"+(form.timeline===t?" active":"")} onClick={()=>set('timeline', t)}>{t}</button>
                  ))}
                </div>
              </div>
            </div>

            {touched && !valid && (
              <p className="form-error">First name, last name, a valid email, project details, and budget are required.</p>
            )}

            <button type="submit" className="pill modal-submit">Send project brief {ARROW}</button>
          </form>
        )}
      </div>
    </div>
  );
}

const PROJECT_TYPES = ["New product","Redesign","Design system","Audit"];
const TIMELINES = ["ASAP","Next month","This quarter","Just exploring"];

function Contact(){
  const [type, setType] = useState(null);
  const [timeline, setTimeline] = useState(null);
  const ready = type && timeline;
  const subject = ready ? `${type} — ${timeline}` : '';
  const body = ready ? `Hi Xperience Studios,\n\nWe're looking at a ${type.toLowerCase()} project, timeline: ${timeline.toLowerCase()}.\n\nHere's what's going on:\n` : '';
  const href = ready
    ? `mailto:bharath@xperiencestudios.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`
    : 'mailto:bharath@xperiencestudios.com';

  return (
    <section id="contact">
      <div className="wrap">
        <div className="contact-card reveal reveal-zoomout">
          <span className="kicker">Start a project</span>
          <h2>Let's design your next move.</h2>
          <p className="sub">Two taps, and we'll draft the email for you — no pitch deck required.</p>

          <div className="builder">
            <div className="builder-row">
              <span className="builder-label">What is it</span>
              <div className="builder-chips">
                {PROJECT_TYPES.map(t=>(
                  <button key={t} className={"demo-chip"+(type===t?" active":"")} onClick={()=>setType(t)}>{t}</button>
                ))}
              </div>
            </div>
            <div className="builder-row">
              <span className="builder-label">When</span>
              <div className="builder-chips">
                {TIMELINES.map(t=>(
                  <button key={t} className={"demo-chip"+(timeline===t?" active":"")} onClick={()=>setTimeline(t)}>{t}</button>
                ))}
              </div>
            </div>
          </div>

          <div className="contact-actions">
            <a className={"pill"+(ready?" ready":"")} href={href}>
              {ready ? `Send: ${subject}` : 'bharath@xperiencestudios.com'} {ARROW}
            </a>
          </div>
        </div>
      </div>
      <footer>
        <div className="wrap foot-row">
          <span>© {new Date().getFullYear()} Xperience Studios LLC</span>
          <div className="foot-links">
            <a href="#work">Work</a>
            <a href="#practice">Practice</a>
            <a href="#contact">Contact</a>
          </div>
        </div>
      </footer>
    </section>
  );
}

function DemoSection(){
  return (
    <section style={{paddingTop:'90px', paddingBottom:'40px'}}>
      <div className="wrap">
        <div className="section-head reveal">
          <span className="kicker">How it starts</span>
          <h2>A real kickoff message, not a sales call.</h2>
          <p>Pick a situation. This is genuinely how we'd respond in the first exchange.</p>
        </div>
        <DemoCard/>
      </div>

function useLandOnTop(){
  useEffect(()=>{
    if(window.location.hash){
      if('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';
      const clean = ()=>{
        window.scrollTo(0, 0);
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      };
      clean();
      requestAnimationFrame(clean);
      setTimeout(clean, 60);
    }
  },[]);
}

function App(){
  useLandOnTop();
  useReveal();
  return (
    <React.Fragment>
      <Nav/>
      <main>
        <Hero/>
        <DemoSection/>
        <Bento/>
        <Practice/>
        <Work/>
        <Process/>
        <Contact/>
      </main>
      <ProjectModal/>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
